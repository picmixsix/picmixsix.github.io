<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Rekomendasi</title>
<meta name="description" content="Rekomendasi produk pilihan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#10231c;--mute:#5b6b64;--line:#d9e1dd;--accent:#ff5a36;--accent-d:#e04420;--brand:#1f6b52}
@media(prefers-color-scheme:dark){:root{--bg:#0e1814;--card:#16251f;--ink:#eaf2ee;--mute:#9db0a7;--line:#27392f;--brand:#5fd1a6}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 40px}
header{text-align:center;padding:12px 0 18px}
.ava{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--line);border:3px solid var(--card);box-shadow:0 0 0 2px var(--brand)}
h1{font-size:1.35rem;font-weight:800;margin-top:10px}
.bio{color:var(--mute);font-size:.9rem;margin-top:4px}
.search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .82rem inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.item{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;font:inherit}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line);display:block}
.ph{position:relative}.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px}
.old{text-decoration:line-through;color:var(--mute);font-size:.74rem;font-weight:400;margin-left:6px}.off{font-size:.72rem;font-weight:800;color:var(--brand);margin-left:6px}
.item .t{padding:10px 10px 4px;font-size:.84rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}
.item .p{padding:0 10px 12px;font-weight:800;color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
footer{text-align:center;color:var(--mute);font-size:.72rem;margin-top:26px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.panel img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line)}
.body{padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.body h2{font-size:1.1rem;font-weight:800}
.price{font-size:1.3rem;font-weight:800;color:var(--accent);margin:4px 0 10px}
.desc{color:var(--mute);font-size:.92rem;white-space:pre-line;margin-bottom:16px}
.buy{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:999px}
.buy:active{background:var(--accent-d)}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.2rem;cursor:pointer}
.pw{position:relative}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="ava" class="ava" alt="" hidden>
    <h1 id="nm">Katalog Rekomendasi</h1>
    <p class="bio" id="bio"></p>
  </header>
  <input class="search" id="q" type="search" placeholder="Cari produk…" aria-label="Cari produk">
  <div class="chips" id="chips"></div>
  <main class="grid" id="grid"><p class="empty">Memuat produk…</p></main>
  <footer>Beberapa link adalah link affiliate. Harga bisa berubah sewaktu-waktu di toko.</footer>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="panel pw" id="panel"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Ubah link share Google Drive jadi link gambar yang bisa ditampilkan
function img(u){
  if(!u)return'';
  const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
  return m&&/drive\.google|googleusercontent/.test(u)?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`:u;
}
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
function price(p){
  if(!p.price)return'Lihat harga';
  const d=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  return rp(p.price)+(d?`<span class="old">${rp(p.oldPrice)}</span><span class="off">-${d}%</span>`:'');
}
const bd=p=>p.badge?`<span class="badge">${esc(p.badge)}</span>`:'';
let all=[],cat='Semua';
function safeUrl(u){try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:'#'}catch{return'#'}}
function render(){
  const q=$('#q').value.toLowerCase();
  const list=all.filter(p=>(cat==='Semua'||p.category===cat)&&(p.name+' '+p.description).toLowerCase().includes(q));
  $('#grid').innerHTML=list.length?list.map(p=>`<button class="item" data-id="${esc(p.id)}"><div class="ph"><img loading="lazy" src="${esc(img(p.image))}" alt="${esc(p.name)}" referrerpolicy="no-referrer">${bd(p)}</div><span class="t">${esc(p.name)}</span><span class="p">${price(p)}</span></button>`).join(''):'<p class="empty">Produk tidak ditemukan.</p>';
}
function chips(){
  const cs=['Semua',...new Set(all.map(p=>p.category).filter(Boolean))];
  $('#chips').innerHTML=cs.length>2?cs.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join(''):'';
}
function open_(id){
  const p=all.find(x=>x.id===id);if(!p)return;
  $('#panel').innerHTML=`<button class="close" aria-label="Tutup">✕</button><div class="ph"><img src="${esc(img(p.image))}" alt="${esc(p.name)}" referrerpolicy="no-referrer">${bd(p)}</div><div class="body"><h2>${esc(p.name)}</h2><div class="price">${price(p)}</div><p class="desc">${esc(p.description)}</p><a class="buy" href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener sponsored">Beli di ${esc(p.store||'Shopee')}</a></div>`;
  $('#sheet').classList.add('open');document.body.style.overflow='hidden';
}
function close_(){$('#sheet').classList.remove('open');document.body.style.overflow=''}
$('#grid').onclick=e=>{const b=e.target.closest('.item');if(b)open_(b.dataset.id)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;chips();render()}};
$('#q').oninput=render;
$('#sheet').onclick=e=>{if(e.target.id==='sheet'||e.target.closest('.close'))close_()};
addEventListener('keydown',e=>e.key==='Escape'&&close_());
fetch('products.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  const pf=d.profile||{};
  if(pf.name){$('#nm').textContent=pf.name;document.title=pf.name}
  $('#bio').textContent=pf.bio||'';
  if(/^#[0-9a-f]{6}$/i.test(pf.color||'')){const r=document.documentElement.style;r.setProperty('--accent',pf.color);r.setProperty('--accent-d',pf.color);r.setProperty('--brand',pf.color)}
  if(pf.avatar){const a=$('#ava');a.src=img(pf.avatar);a.hidden=false;a.referrerPolicy='no-referrer'}
  all=(d.products||[]).filter(p=>p.active!==false);
  chips();render();
}).catch(()=>{$('#grid').innerHTML='<p class="empty">Gagal memuat produk. Coba muat ulang halaman.</p>'});
</script>
</body>
</html>
