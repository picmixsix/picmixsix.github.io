<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toko Digital</title>
<meta name="description" content="Undangan digital, e-book, website portofolio, dan desain">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4effa;--card:#fff;--ink:#1b1230;--mute:#6b6280;--line:#e4dbf0;--brand:#6a2fa8;--btn:#6a2fa8;--soft:#ece2f7;--nav:#1f1038}
@media(prefers-color-scheme:dark){:root{--bg:#150e22;--card:#1f1631;--ink:#f1ebfa;--mute:#aa9fc2;--line:#32264a;--brand:#b184f2;--soft:#2b1f44;--nav:#0d0816}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top);line-height:1.45}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 120px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:2rem;font-weight:800;line-height:1.05;text-transform:uppercase;letter-spacing:-.01em}
h1 b{display:block;color:var(--brand)}
.bio{color:var(--mute);font-size:.86rem;margin-top:8px}
.ava{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:16px 0}
.banner{display:flex;align-items:stretch;background:linear-gradient(120deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:150px}
.bt{flex:1.2;padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.bt small{color:var(--brand);font-weight:800;font-size:.68rem;letter-spacing:.06em}
.bt h2{font-size:1.1rem;font-weight:800;margin:4px 0;line-height:1.2}
.bt p{font-size:.78rem;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bimg{flex:1;object-fit:cover;width:42%;min-width:0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-weight:800;font-size:1rem;padding:15px;border-radius:16px;border:0;cursor:pointer;margin-top:10px}
.pill{width:auto;padding:9px 16px;font-size:.8rem;margin-top:10px;border-radius:999px;background:var(--nav);color:#fff}
.buy{background:var(--btn);color:#fff}
.demo{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.wa{background:#1fa855;color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}
.sec h3{font-size:.82rem;font-weight:800;letter-spacing:.04em}
.sec button{background:none;border:0;color:var(--brand);font-weight:700;font-size:.74rem;cursor:pointer}
.cats{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cats::-webkit-scrollbar,.row::-webkit-scrollbar,.gal::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.66rem;font-weight:700;text-transform:uppercase}
.cat i{font-style:normal;width:60px;height:60px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.5rem;border:2px solid transparent}
.cat.on i{border-color:var(--brand)}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.row .item{flex:0 0 42%;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit}
.ph{position:relative}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--soft);display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--btn);color:#fff;font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px}
.hr{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--brand);display:grid;place-items:center;font-size:1rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.item .c{padding:9px 10px 0;font-size:.64rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.item .t{padding:2px 10px 4px;font-size:.84rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.item .p{padding:0 10px 12px;font-weight:800;font-size:.95rem}
.old{text-decoration:line-through;color:var(--mute);font-size:.72rem;font-weight:400;margin-left:6px}
.off{font-size:.7rem;font-weight:800;color:var(--brand);margin-left:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:36px 0;font-size:.9rem}
footer{text-align:center;color:var(--mute);font-size:.72rem;margin-top:26px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--nav);border-radius:22px;display:flex;padding:8px 4px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.nav button{flex:1;background:none;border:0;color:#bfb2da;font-weight:600;font-size:.66rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.nav button i{font-style:normal;font-size:1.15rem}.nav button.on{color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.panel{position:relative;background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--soft)}
.gal img{flex:0 0 100%;scroll-snap-align:center;width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.close,.ar{position:absolute;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1b1230;font-size:1.2rem;cursor:pointer;display:grid;place-items:center;z-index:2}
.close{top:12px;left:12px}.panel .hr{top:12px;right:12px;width:38px;height:38px;z-index:2}
.ar{top:42%}.ar.l{left:10px}.ar.r{right:10px}
.panel .badge{top:auto;bottom:14px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}.dots i.on{background:var(--btn)}
.body{padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hd h2{font-size:1.2rem;font-weight:800;line-height:1.2;text-transform:uppercase}
.hd .cat2{color:var(--brand);font-weight:700;font-size:.8rem;margin-top:2px}
.hd .price{font-size:1.35rem;font-weight:800;text-align:right;flex:none}
.desc{color:var(--mute);font-size:.9rem;white-space:pre-line;margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.body h4{font-size:.78rem;font-weight:800;letter-spacing:.04em;margin:4px 0 8px}
.inc{list-style:none;padding:0;margin-bottom:6px}
.inc li{font-size:.88rem;padding:4px 0 4px 26px;position:relative}
.inc li::before{content:"✓";position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--brand);font-size:.7rem;font-weight:800;display:grid;place-items:center}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:14px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.back{background:none;border:0;color:var(--mute);font-weight:600;font-size:.85rem;padding:16px 16px 0;cursor:pointer}
.qr{display:block;width:min(260px,70%);margin:12px auto;border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line)}
.tot{text-align:center;font-size:1.6rem;font-weight:800;color:var(--brand)}
.note{font-size:.8rem;color:var(--mute);text-align:center;margin-top:6px}
.steps{font-size:.84rem;color:var(--mute);margin:14px 0 0 18px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="nm">Toko <b>Digital</b></h1><p class="bio" id="bio"></p></div>
    <img id="ava" class="ava" alt="" hidden>
  </header>
  <input class="search" id="q" type="search" placeholder="Cari undangan, e-book, desain…" aria-label="Cari produk">
  <section id="banner" hidden></section>
  <div class="sec" id="catsec"><h3>KATEGORI</h3><button data-cat="Semua">Lihat semua</button></div>
  <div class="cats" id="cats"></div>
  <div id="bestwrap" hidden><div class="sec"><h3>TERLARIS</h3></div><div class="row" id="best"></div></div>
  <div class="sec"><h3 id="gt">SEMUA PRODUK</h3></div>
  <main class="grid" id="grid"><p class="empty">Memuat produk…</p></main>
  <footer>Pembayaran via QRIS. Akses dikirim setelah pembayaran dikonfirmasi.</footer>
</div>
<nav class="nav" aria-label="Menu">
  <button data-nav="home" class="on"><i>🏠</i>Beranda</button>
  <button data-nav="search"><i>🔍</i>Cari</button>
  <button data-nav="fav"><i>♡</i>Favorit</button>
  <button data-nav="wa"><i>💬</i>WhatsApp</button>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(u,w=800){
  if(!u)return'';
  const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
  return m&&/drive\.google|googleusercontent/.test(u)?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w${w}`:u;
}
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const imgs=p=>p.images||(p.image?[p.image]:[]);
const bd=p=>p.badge?`<span class="badge">${esc(p.badge)}</span>`:'';
const safeUrl=u=>{try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:'#'}catch{return'#'}};
let icons={};
const ico=c=>icons[c]||(/undangan/i.test(c)?'💌':/e-?book|buku/i.test(c)?'📘':/web|porto/i.test(c)?'🌐':/desain|design|template/i.test(c)?'🎨':c==='Semua'?'🛍️':'✨');
function price(p){
  if(!p.price)return'Hubungi kami';
  const d=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  return rp(p.price)+(d?`<span class="old">${rp(p.oldPrice)}</span><span class="off">-${d}%</span>`:'');
}
let catList=[],all=[],cat='Semua',pf={},cur=null,favMode=false,fav=new Set();
try{fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch{}
const heart=id=>fav.has(id)?'♥':'♡';
function card(p){
  return `<button class="item" data-open="${esc(p.id)}"><div class="ph"><img loading="lazy" src="${esc(img(imgs(p)[0],500))}" alt="${esc(p.name)}" referrerpolicy="no-referrer">${bd(p)}<span class="hr" role="button" aria-label="Favorit" data-fav="${esc(p.id)}">${heart(p.id)}</span></div><span class="c">${esc(p.category)}</span><span class="t">${esc(p.name)}</span><span class="p">${price(p)}</span></button>`;
}
function render(){
  const q=$('#q').value.toLowerCase().trim(),home=cat==='Semua'&&!q&&!favMode;
  const list=all.filter(p=>(!favMode||fav.has(p.id))&&(cat==='Semua'||p.category===cat)&&(p.name+' '+p.description+' '+p.category).toLowerCase().includes(q));
  const f=all.find(p=>p.featured)||all[0];
  $('#banner').hidden=!(home&&f);
  if(home&&f)$('#banner').innerHTML=`<div class="banner"><div class="bt"><small>TERBARU</small><h2>${esc(f.name)}</h2><p>${esc(f.description)}</p><button class="btn pill" data-open="${esc(f.id)}">Lihat →</button></div>${imgs(f)[0]?`<img class="bimg" src="${esc(img(imgs(f)[0],600))}" alt="" referrerpolicy="no-referrer">`:''}</div>`;
  const best=all.filter(p=>p.badge==='Terlaris');
  $('#bestwrap').hidden=!(home&&best.length);$('#best').innerHTML=best.map(card).join('');
  $('#gt').textContent=favMode?'FAVORIT':cat==='Semua'?'SEMUA PRODUK':cat.toUpperCase();
  $('#grid').innerHTML=list.length?list.map(card).join(''):`<p class="empty">${favMode?'Belum ada favorit. Ketuk ♡ pada produk.':'Produk tidak ditemukan.'}</p>`;
  const used=new Set(all.map(p=>p.category).filter(Boolean)),cs=['Semua',...catList.map(c=>c.name).filter(n=>used.has(n)),...[...used].filter(n=>!catList.some(c=>c.name===n))];
  $('#cats').innerHTML=cs.length>2?cs.map(c=>`<button class="cat ${c===cat?'on':''}" data-cat="${esc(c)}"><i>${ico(c)}</i>${esc(c)}</button>`).join(''):'';
  $('#catsec').hidden=$('#cats').innerHTML==='';
  document.querySelector('[data-nav=fav]').className=favMode?'on':'';
  document.querySelector('[data-nav=home]').className=favMode?'':'on';
}
function embed(u){
  if(!u)return'';
  let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  if(m)return`https://www.youtube-nocookie.com/embed/${m[1]}`;
  m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  return m?`https://drive.google.com/file/d/${m[1]}/preview`:'';
}
function detail(p){
  cur=p;const im=imgs(p),inc=p.includes||[],em=embed(p.demo);
  $('#panel').innerHTML=`<div class="ph"><div class="gal" id="gal">${im.length?im.map(u=>`<img src="${esc(img(u))}" alt="${esc(p.name)}" referrerpolicy="no-referrer">`).join(''):'<img alt="">'}</div><button class="close" aria-label="Kembali">←</button><span class="hr" role="button" aria-label="Favorit" data-fav="${esc(p.id)}">${heart(p.id)}</span>${im.length>1?`<button class="ar l" data-ar="-1" aria-label="Sebelumnya">‹</button><button class="ar r" data-ar="1" aria-label="Berikutnya">›</button><div class="dots" id="dots">${im.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}${bd(p)}</div><div class="body"><div class="hd"><div><h2>${esc(p.name)}</h2><div class="cat2">${esc(p.category)}</div></div><div class="price">${price(p)}</div></div><p class="desc">${esc(p.description)}</p>${em?`<h4>VIDEO DEMO</h4><div class="vid"><iframe src="${esc(em)}" title="Video demo" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:''}${inc.length?`<h4>YANG ANDA DAPATKAN</h4><ul class="inc">${inc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${p.demo&&!em?`<a class="btn demo" href="${esc(safeUrl(p.demo))}" target="_blank" rel="noopener">Lihat Demo</a>`:''}<button class="btn buy" data-buy>Beli Sekarang</button></div>`;
  const g=$('#gal');g.onscroll=()=>{const i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll('#dots i').forEach((d,k)=>d.className=k===i?'on':'')};
  $('#panel').scrollTop=0;
}
function wa(msg){
  let n=String(pf.whatsapp||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);
  return n?`https://wa.me/${n}?text=${encodeURIComponent(msg)}`:'';
}
function pay(){
  const p=cur,code=p.price?Math.floor(Math.random()*89)+11:0,total=p.price?p.price+code:0;
  const msg=`Halo, saya mau pesan "${p.name}"`+(total?` dan sudah bayar ${rp(total)} via QRIS.`:'.')+` Mohon info langkah selanjutnya.`;
  const link=wa(msg),qr=img(pf.qris,700);
  $('#panel').innerHTML=`<button class="back" data-back>← Kembali</button><div class="body"><h2 style="font-size:1.1rem;font-weight:800">${esc(p.name)}</h2>${total&&qr?`<img class="qr" src="${esc(qr)}" alt="QRIS" referrerpolicy="no-referrer"><div class="tot">${rp(total)}</div><p class="note">Bayar tepat sesuai nominal ini (sudah termasuk kode unik ${code}) supaya cepat terverifikasi.</p><button class="btn demo" data-copy="${total}">Salin nominal</button>`:''}${link?`<a class="btn wa" href="${esc(link)}" target="_blank" rel="noopener">${total?'Saya sudah bayar, konfirmasi via WhatsApp':'Pesan via WhatsApp'}</a>`:'<p class="note">Kontak penjual belum diatur.</p>'}<ol class="steps"><li>Scan QRIS dan bayar sesuai nominal.</li><li>Tekan tombol WhatsApp untuk konfirmasi.</li><li>Kirim data atau foto yang diminta, lalu akses dikirim setelah pembayaran dicek.</li></ol></div>`;
  $('#panel').scrollTop=0;
}
function close_(){$('#panel').innerHTML='';$('#sheet').classList.remove('open');document.body.style.overflow=''}
function toggleFav(id){
  fav.has(id)?fav.delete(id):fav.add(id);
  try{localStorage.setItem('fav',JSON.stringify([...fav]))}catch{}
  document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(el=>el.textContent=heart(id));
  if(favMode)render();
}
document.addEventListener('click',e=>{
  const t=e.target;let x;
  if(x=t.closest('[data-fav]'))return toggleFav(x.dataset.fav);
  if(x=t.closest('[data-open]')){const p=all.find(a=>a.id===x.dataset.open);if(p){detail(p);$('#sheet').classList.add('open');document.body.style.overflow='hidden'}return}
  if(x=t.closest('[data-cat]')){cat=x.dataset.cat;favMode=false;render();return}
  if(x=t.closest('[data-nav]')){
    const n=x.dataset.nav;
    if(n==='home'){favMode=false;cat='Semua';$('#q').value='';render();scrollTo({top:0,behavior:'smooth'})}
    if(n==='search'){$('#q').scrollIntoView({block:'center',behavior:'smooth'});$('#q').focus()}
    if(n==='fav'){favMode=!favMode;cat='Semua';render();$('#gt').scrollIntoView({behavior:'smooth'})}
    if(n==='wa'){const l=wa('Halo, saya mau tanya produk digitalnya.');l?open(l,'_blank'):alert('Nomor WhatsApp belum diatur.')}
    return;
  }
  if(!$('#sheet').classList.contains('open'))return;
  if(t.id==='sheet'||t.closest('.close'))return close_();
  if(t.closest('[data-buy]'))return pay();
  if(t.closest('[data-back]'))return detail(cur);
  if(x=t.closest('[data-ar]')){const g=$('#gal');g.scrollBy({left:g.clientWidth*x.dataset.ar,behavior:'smooth'});return}
  if(x=t.closest('[data-copy]')){try{navigator.clipboard.writeText(x.dataset.copy);x.textContent='Tersalin ✓'}catch{}}
});
$('#q').oninput=render;
addEventListener('keydown',e=>e.key==='Escape'&&close_());
fetch('products.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  pf=d.profile||{};catList=d.categories||[];icons={};catList.forEach(c=>{if(c.icon)icons[c.name]=c.icon});
  if(pf.name){document.title=pf.name;const w=pf.name.trim().split(/\s+/),l=w.pop();$('#nm').innerHTML=(w.length?esc(w.join(' '))+' ':'')+`<b>${esc(l)}</b>`}
  $('#bio').textContent=pf.bio||'';
  if(pf.avatar){const a=$('#ava');a.src=img(pf.avatar,200);a.hidden=false;a.referrerPolicy='no-referrer'}
  if(/^#[0-9a-f]{6}$/i.test(pf.color||'')){const r=document.documentElement.style;r.setProperty('--brand',pf.color);r.setProperty('--btn',pf.color)}
  all=(d.products||[]).filter(p=>p.active!==false);
  render();
}).catch(()=>{$('#grid').innerHTML='<p class="empty">Gagal memuat produk. Coba muat ulang halaman.</p>'});
</script>
</body>
</html>
