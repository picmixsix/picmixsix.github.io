name: Update Katalog via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  tambah-produk:
    if: contains(github.event.issue.labels.*.name, 'produk-baru')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Proses Data Issue ke JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            
            const extract = (label) => body.split('### ' + label)[1]?.split('###')[0]?.trim();
            
            const nama = extract('Nama Produk');
            const gambar = extract('Link Gambar Produk');
            const link = extract('Link Affiliate TikTok');
            
            if (nama && gambar && link) {
              let products = [];
              if (fs.existsSync('products.json')) {
                products = JSON.parse(fs.readFileSync('products.json', 'utf8'));
              }
              
              products.unshift({ nama, gambar, link });
              fs.writeFileSync('products.json', JSON.stringify(products, null, 2));
              console.log("Berhasil memperbarui JSON");
            }

      - name: Commit dan Push ke Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Auto-update: Menambah produk dari Issue #${{ github.event.issue.number }}" || echo "Tidak ada perubahan"
          git push

      - name: Tutup Issue Otomatis
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Produk berhasil ditambahkan ke `products.json`. Katalog sedang diperbarui oleh GitHub Pages.'
            });
