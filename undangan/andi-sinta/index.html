<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --marun:#4a1520; --marun-tua:#2e0a12; --krem:#f7ece6; --blush:#ecd3cc;
  --emas:#c9a45c; --segel:#f0d2bf; --teks:#4a1520;
  --serif:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script','Snell Roundhand',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--serif);background:var(--krem);color:var(--teks);font-size:19px;line-height:1.6;overflow-x:hidden}
body.kunci{overflow:hidden;height:100vh}

/* ===== AMPLOP ===== */
#amplop{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 50%,#ffe3a8 0,#f2b866 0,transparent 0);overflow:hidden}
#amplop .cahaya{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff3cf 0,#f0b35e 25%,var(--marun-tua) 70%);opacity:0;transition:opacity 1.2s}
.sisi{position:absolute;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.05) 0 2px,transparent 3px) 0 0/28px 28px,
  linear-gradient(160deg,#5b1b28,var(--marun-tua));
  transition:transform 1.6s cubic-bezier(.65,0,.25,1)}
.atas{inset:0;clip-path:polygon(0 0,100% 0,50% 50%)}
.bawah{inset:0;clip-path:polygon(0 100%,100% 100%,50% 50%);filter:brightness(.85)}
.kiri{inset:0;clip-path:polygon(0 0,0 100%,50% 50%);filter:brightness(.7)}
.kanan{inset:0;clip-path:polygon(100% 0,100% 100%,50% 50%);filter:brightness(.7)}
.garis{position:absolute;inset:0;pointer-events:none;transition:opacity .6s}
.garis svg{width:100%;height:100%}
.segel{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fbe6d8,var(--segel) 55%,#d9ab93);
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 5px rgba(255,255,255,.18),inset 0 0 0 7px rgba(120,60,40,.18);
  color:#8a4b3a;font:italic 600 34px/1 var(--serif);cursor:pointer;transition:transform .7s,opacity .7s;animation:denyut 2.4s ease-in-out infinite}
@keyframes denyut{50%{transform:scale(1.07)}}
.petunjuk{position:absolute;left:0;right:0;bottom:11%;text-align:center;color:var(--segel);font-style:italic;letter-spacing:.04em;transition:opacity .5s}
.kepada{position:absolute;left:0;right:0;top:9%;text-align:center;color:var(--segel);padding:0 24px;transition:opacity .5s}
.kepada small{display:block;font-size:15px;opacity:.8}
.kepada b{display:block;font:400 30px/1.2 var(--script);margin-top:4px}
#amplop.buka .cahaya{opacity:1}
#amplop.buka .atas{transform:translateY(-101%)}
#amplop.buka .bawah{transform:translateY(101%)}
#amplop.buka .kiri{transform:translateX(-101%)}
#amplop.buka .kanan{transform:translateX(101%)}
#amplop.buka .segel{transform:scale(1.5);opacity:0;animation:none}
#amplop.buka .garis,#amplop.buka .petunjuk,#amplop.buka .kepada{opacity:0}
#amplop.hilang{display:none}

/* ===== ISI ===== */
section{padding:72px 26px;text-align:center;max-width:560px;margin:0 auto}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;max-width:none;
  background:radial-gradient(ellipse at 50% 0,#fff8f3,var(--krem) 60%,var(--blush));position:relative}
.hero::before,.hero::after{content:"";position:absolute;left:50%;width:1px;height:70px;background:linear-gradient(var(--emas),transparent)}
.hero::before{top:0}.hero::after{bottom:0;transform:rotate(180deg)}
.pembuka{font-style:italic;font-size:20px;opacity:.85}
.nama{font:400 clamp(58px,17vw,92px)/1 var(--script);color:var(--marun);margin:18px 0 6px}
.dan{font:italic 24px var(--serif);color:var(--emas);margin:2px 0}
.tgl{margin-top:26px;font-size:20px;letter-spacing:.14em}
h2{font:400 44px/1.1 var(--script);color:var(--marun);margin-bottom:22px}
.hiasan{display:block;width:120px;height:14px;margin:0 auto 18px}
.hitung{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.hitung div{border:1px solid var(--emas);padding:14px 0 10px;background:rgba(255,255,255,.45)}
.hitung b{display:block;font:600 34px/1 var(--serif)}
.hitung span{font-size:15px;opacity:.8}
.gelap{background:linear-gradient(170deg,var(--marun),var(--marun-tua));color:var(--krem);max-width:none}
.gelap h2{color:var(--segel)}
.gelap .isi{max-width:560px;margin:0 auto}
.garis-waktu{position:relative;margin:10px auto 0;text-align:left;max-width:360px}
.garis-waktu::before{content:"";position:absolute;left:78px;top:6px;bottom:6px;width:1px;background:var(--emas)}
.acara{display:flex;gap:30px;padding:14px 0;position:relative}
.acara::after{content:"";position:absolute;left:73px;top:24px;width:11px;height:11px;border-radius:50%;background:var(--segel);box-shadow:0 0 0 3px var(--marun)}
.acara time{width:50px;text-align:right;font-weight:600;color:var(--segel)}
.acara span{flex:1;padding-left:6px}
.alamat{font-size:20px;margin-bottom:6px}
.tombol{display:inline-block;margin-top:18px;padding:13px 30px;border:1px solid var(--emas);background:var(--marun);color:var(--krem);font:600 18px var(--serif);letter-spacing:.06em;text-decoration:none;cursor:pointer;transition:background .25s}
.tombol:hover,.tombol:focus-visible{background:var(--marun-tua)}
form{text-align:left;margin-top:8px}
label{display:block;margin:14px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--emas);background:rgba(255,255,255,.7);font:inherit;color:var(--teks);border-radius:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,.tombol:focus-visible,.segel:focus-visible{outline:2px solid var(--emas);outline-offset:2px}
form .tombol{width:100%;text-align:center;margin-top:22px}
footer{padding:40px 20px 90px;text-align:center;font-style:italic;opacity:.8}
#musik{position:fixed;right:16px;bottom:18px;z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--emas);background:var(--marun);color:var(--segel);font-size:18px;cursor:pointer;display:none}
.muncul{opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}
.muncul.tampil{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body class="kunci">

<!-- ===== AMPLOP ===== -->
<div id="amplop">
  <div class="cahaya"></div>
  <div class="sisi bawah"></div><div class="sisi kiri"></div><div class="sisi kanan"></div><div class="sisi atas"></div>
  <div class="garis"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0L50 50L100 0M0 100L50 50L100 100" fill="none" stroke="#c9a45c" stroke-width=".35" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="kepada"><small>Kepada Yth.</small><b id="tamu">Tamu Undangan</b></div>
  <button class="segel" id="segel" aria-label="Buka undangan"></button>
  <div class="petunjuk">Ketuk segel untuk membuka</div>
</div>

<button id="musik" aria-label="Putar atau jeda musik">♪</button>
<audio id="audio" loop></audio>

<!-- ===== ISI UNDANGAN ===== -->
<section class="hero">
  <p class="pembuka muncul" id="pembuka"></p>
  <h1 class="nama muncul"><span id="pria"></span><div class="dan">&amp;</div><span id="wanita"></span></h1>
  <p class="tgl muncul" id="tglTeks"></p>
</section>

<section>
  <svg class="hiasan" viewBox="0 0 120 14"><path d="M0 7H48M72 7H120" stroke="#c9a45c"/><circle cx="60" cy="7" r="4" fill="none" stroke="#c9a45c"/></svg>
  <h2 class="muncul">Menuju Hari Bahagia</h2>
  <div class="hitung muncul">
    <div><b id="h">0</b><span>Hari</span></div><div><b id="j">0</b><span>Jam</span></div>
    <div><b id="m">0</b><span>Menit</span></div><div><b id="d">0</b><span>Detik</span></div>
  </div>
</section>

<section class="gelap"><div class="isi">
  <h2 class="muncul">Susunan Acara</h2>
  <div class="garis-waktu muncul" id="acara"></div>
</div></section>

<section>
  <h2 class="muncul">Lokasi</h2>
  <p class="alamat muncul" id="tempat"></p>
  <p class="muncul" id="alamat"></p>
  <a class="tombol muncul" id="peta" target="_blank" rel="noopener">Buka di Maps</a>
</section>

<section class="gelap"><div class="isi">
  <h2 class="muncul">Konfirmasi Kehadiran</h2>
  <p class="muncul">Mohon konfirmasi agar kami dapat menyiapkan segalanya dengan baik.</p>
  <form id="rsvp" class="muncul">
    <label for="fn">Nama</label><input id="fn" required>
    <label for="fs">Kehadiran</label>
    <select id="fs"><option>Hadir</option><option>Tidak dapat hadir</option></select>
    <label for="fj">Jumlah tamu</label><input id="fj" type="number" min="1" max="10" value="1">
    <label for="fu">Ucapan (opsional)</label><textarea id="fu" rows="3"></textarea>
    <button class="tombol" type="submit">Kirim lewat WhatsApp</button>
  </form>
</div></section>

<footer id="penutup"></footer>

<script>
/* ===== UBAH DATA DI SINI SAJA ===== */
const DATA = {
  pria: "Zachary",
  wanita: "Gabriella",
  pembuka: "Dengan penuh syukur, kami mengundang Anda ke pernikahan kami",
  tanggal: "2027-02-14T16:00:00+07:00",
  acara: [
    ["16.00", "Tamu tiba"],
    ["17.00", "Akad nikah"],
    ["19.00", "Resepsi"],
    ["20.30", "Makan malam"]
  ],
  tempat: "Gedung Serbaguna Mawar",
  alamat: "Jl. Contoh No. 12, Kota Anda",
  peta: "https://maps.google.com/?q=Jakarta",
  wa: "6281234567890",
  musik: "",            // isi dengan nama file mp3, mis. "lagu.mp3"
  penutup: "Merupakan kehormatan bagi kami atas kehadiran dan doa restu Anda."
};
/* ================================== */

const $ = id => document.getElementById(id);
const awal = s => s.trim().charAt(0).toUpperCase();
$('pria').textContent = DATA.pria; $('wanita').textContent = DATA.wanita;
$('segel').textContent = awal(DATA.wanita) + awal(DATA.pria);
$('pembuka').textContent = DATA.pembuka;
$('tempat').textContent = DATA.tempat; $('alamat').textContent = DATA.alamat;
$('peta').href = DATA.peta; $('penutup').textContent = DATA.penutup;
$('acara').innerHTML = DATA.acara.map(a => `<div class="acara"><time>${a[0]}</time><span>${a[1]}</span></div>`).join('');

const waktu = new Date(DATA.tanggal);
$('tglTeks').textContent = waktu.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.title = `Undangan ${DATA.wanita} & ${DATA.pria}`;

/* nama tamu dari link: ?to=Budi+Santoso */
const tamu = new URLSearchParams(location.search).get('to');
if (tamu) $('tamu').textContent = tamu;

function hitung(){
  let s = Math.max(0, Math.floor((waktu - Date.now()) / 1000));
  $('h').textContent = Math.floor(s/86400); $('j').textContent = Math.floor(s%86400/3600);
  $('m').textContent = Math.floor(s%3600/60); $('d').textContent = s%60;
}
hitung(); setInterval(hitung, 1000);

/* buka amplop */
const audio = $('audio'), tombolMusik = $('musik');
$('segel').addEventListener('click', () => {
  $('amplop').classList.add('buka');
  if (DATA.musik){ audio.src = DATA.musik; audio.play().catch(()=>{}); tombolMusik.style.display = 'block'; }
  setTimeout(() => { $('amplop').classList.add('hilang'); document.body.classList.remove('kunci'); pantau(); }, 1800);
});
tombolMusik.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());

function pantau(){
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('tampil'); io.unobserve(e.target); } }), {threshold:.15});
  document.querySelectorAll('.muncul').forEach(el => io.observe(el));
}

/* RSVP ke WhatsApp */
$('rsvp').addEventListener('submit', e => {
  e.preventDefault();
  const t = `Halo, saya ${$('fn').value}.\nKehadiran: ${$('fs').value}\nJumlah tamu: ${$('fj').value}\nUcapan: ${$('fu').value || '-'}`;
  window.open(`https://wa.me/${DATA.wa}?text=${encodeURIComponent(t)}`, '_blank');
});
</script>
</body>
</html>
