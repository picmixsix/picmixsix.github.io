<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Pilihan</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        .container { 
            max-width: 480px; 
            margin: 0 auto; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .header img { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            object-fit: cover;
            border: 3px solid #20D5EC; 
        }
        .header h1 { margin: 10px 0 5px 0; font-size: 22px; }
        .header p { margin: 0; color: #666; font-size: 14px; }

        .product-card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.98); }
        .product-img { 
            width: 80px; 
            height: 80px; 
            border-radius: 8px; 
            object-fit: cover; 
            margin-right: 15px; 
            background-color: #eee;
        }
        .product-info { flex-grow: 1; }
        .product-title { margin: 0 0 8px 0; font-size: 15px; font-weight: 600; line-height: 1.3;}
        .btn { 
            display: inline-block; 
            background: #FE2C55; 
            color: #fff; 
            text-decoration: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: bold; 
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- Menampilkan foto profil otomatis dari akun GitHub sandyackerman -->
            <img src="https://avatars.githubusercontent.com/sandyackerman" alt="Profil">
            <h1>Katalog Produk</h1>
            <p>Racun TikTok Original & Terpercaya 🛒</p>
        </div>

        <!-- Wadah kosong untuk merender produk dari JSON -->
        <div id="katalog-produk"></div>
    </div>

    <script>
        fetch('products.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('katalog-produk');
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${item.gambar}" alt="Produk" class="product-img">
                            <div class="product-info">
                                <h3 class="product-title">${item.nama}</h3>
                                <a href="${item.link}" class="btn" target="_blank">Beli Sekarang</a>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(error => console.error('Error memuat produk:', error));
    </script>

</body>
</html>
